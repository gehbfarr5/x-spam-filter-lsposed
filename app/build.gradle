plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "dev.xspamfilter.lsposed"
    compileSdk 36

    defaultConfig {
        applicationId "dev.xspamfilter.lsposed"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // LSPosed supplies the Xposed API at runtime; never package it in this APK.
    compileOnly files("libs/api-82.jar")

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation files("libs/api-82.jar")
}
